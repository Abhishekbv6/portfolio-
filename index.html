<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abhishek B V — Portfolio</title>
<meta name="description" content="MCA student with a data science internship, looking for entry-level and intern AI roles. Agentic AI, RAG, machine learning and analytics projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f4;--ink:#14231f;--muted:#51625d;--line:#cfd9d5;--accent:#0c6b58;--chip:#e2ebe8;--panel:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a17;--ink:#e6efec;--muted:#98aaa4;--line:#27403a;--accent:#4fd1b0;--chip:#1a2c27;--panel:#13221e}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.08rem/1.65 "Source Serif 4",Georgia,serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0}
a{color:var(--accent)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:860px;margin:0 auto;padding:0 1.25rem}
nav{display:flex;gap:1.25rem;flex-wrap:wrap;padding:1.25rem 0;font-family:"Bricolage Grotesque",sans-serif;font-size:.95rem}
nav a{color:var(--muted);text-decoration:none}
nav a:hover{color:var(--ink)}
.hero{padding:3rem 0 3.5rem}
.hero h1{font-size:clamp(2.6rem,8vw,4.6rem);font-weight:700;letter-spacing:-.03em}
.hero p.lead{font-size:1.25rem;max-width:34em;margin:1.2rem 0 0}
.stats{display:flex;gap:2rem;flex-wrap:wrap;margin:1.6rem 0 0;color:var(--muted);font-size:.98rem}
.stats b{display:block;font:700 1.5rem "Bricolage Grotesque",sans-serif;color:var(--ink)}
.trace{margin-top:2.2rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.25rem;font-size:.95rem}
.trace p{margin:0 0 .7rem;color:var(--muted)}
.flow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-family:"Bricolage Grotesque",sans-serif}
.node{background:var(--chip);padding:.35rem .7rem;border-radius:6px}
.arrow{color:var(--muted)}
.outs{display:flex;flex-direction:column;gap:.3rem}
.outs span{border:1px solid var(--accent);color:var(--accent);padding:.15rem .6rem;border-radius:6px;font-size:.9rem}
section{padding:2.5rem 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(1.7rem,4.5vw,2.3rem);margin-bottom:1.2rem}
.about p{max-width:38em;margin:0 0 1rem}
.proj{padding:1.4rem 0;border-bottom:1px solid var(--line)}
.proj:last-child{border-bottom:0}
.proj h3{font-size:1.35rem;margin-bottom:.4rem}
.proj p{margin:0 0 .7rem;max-width:40em}
.tags{display:flex;gap:.4rem;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.tags li{background:var(--chip);border-radius:5px;padding:.1rem .55rem;font:500 .85rem "Bricolage Grotesque",sans-serif}
.proj .links{margin-top:.7rem;font-family:"Bricolage Grotesque",sans-serif;font-size:.95rem}
.certs{list-style:none;padding:0;margin:0}
.certs li{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.certs li:last-child{border-bottom:0}
.certs span{color:var(--muted);white-space:nowrap}
.stack dl{display:grid;grid-template-columns:9rem 1fr;gap:.9rem 1rem;margin:0}
.stack dt{font:700 1rem "Bricolage Grotesque",sans-serif}
.stack dd{margin:0;color:var(--muted)}
